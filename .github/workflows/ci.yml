name: Nomad CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  msrv:
    name: MSRV 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust 1.88
        run: rustup toolchain install 1.88 --profile minimal

      - name: Workspace check on MSRV
        run: cargo +1.88 check --workspace --all-targets
  checks:

    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Tests
        run: cargo test --workspace --all-targets

      - name: Privacy and signed-update regression tests
        run: |
          cargo test -p nomad-engine privacy
          cargo test -p nomad-engine update

      - name: Protocol security regression tests
        run: |
          cargo test -p nomad-engine xray
          cargo test -p nomad-engine umc

      - name: Native Servo compile
        run: cargo check -p nomad-browser --features native-servo

      - name: Native Servo release build
        run: cargo build --release -p nomad-browser --features native-servo

  fuzz-build:
    name: Fuzz targets compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Build fuzz targets
        run: cargo fuzz build --fuzz-dir fuzz

      - name: Fuzz Xray profile parser
        run: cargo fuzz run xray_config --fuzz-dir fuzz -- -runs=1000

      - name: Fuzz network profile parser
        run: cargo fuzz run network_profile --fuzz-dir fuzz -- -runs=1000

      - name: Fuzz proxy endpoint parser
        run: cargo fuzz run proxy_endpoint --fuzz-dir fuzz -- -runs=1000

      - name: Fuzz extension manifest parser
        run: cargo fuzz run extension_manifest --fuzz-dir fuzz -- -runs=1000

      - name: Fuzz UMC control envelope parser
        run: cargo fuzz run umc_control_envelope --fuzz-dir fuzz -- -runs=1000

  large-session:
    name: Large-session benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Run session serialization benchmark
        run: cargo bench -p nomad-shell --bench large_session
