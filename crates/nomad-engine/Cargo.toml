[package]
name = "nomad-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
fuzzing = []
servo = [
    "dep:crossbeam-channel",
    "dep:euclid",
    "dep:servo-url",
    "dep:glow",
    "dep:servo",
    "dep:servo-webdriver-server",
    "dep:winit",
    "dep:image",
    "dep:keyboard-types",
]
media-gstreamer = ["servo", "servo/media-gstreamer"]

[dependencies]
nomad-core = { path = "../nomad-core" }
aes = "0.8"
base64 = "0.22"
blake3 = "1"
boringtun = { version = "0.7.1", default-features = false }
bytes = "1"
cookie = "0.18"
chacha20poly1305 = "0.10"
crc32fast = "1"
crossbeam-channel = { version = "0.5", optional = true }
h2 = "0.4"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1.5"
keyring = "3.6"
interprocess = "2.4.3"
md-5 = "0.10"
ring = "0.17"
quinn = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
smoltcp = { version = "0.12.0", default-features = false, features = ["alloc", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp", "std"] }
tar = "0.4"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging"] }
tungstenite = "0.30"
rustls = "0.23"
webpki-roots = "1.0"
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
url = "2.5"
euclid = { version = "0.22", optional = true }
flate2 = "1"
servo-url = { path = "../../vendor/servo/components/url", package = "servo-url", optional = true }
glow = { version = "0.17.0", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
keyboard-types = { version = "0.8.3", optional = true }

servo = { path = "../../vendor/servo/components/servo", package = "servo", default-features = false, features = ["baked-in-resources", "clipboard", "js_jit"], optional = true }
servo-webdriver-server = { path = "../../vendor/servo/components/webdriver_server", optional = true }
winit = { version = "0.30.13", optional = true }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
