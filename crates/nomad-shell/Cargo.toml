[package]
name = "nomad-shell"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22"
nomad-core = { path = "../nomad-core" }
nomad-engine = { path = "../nomad-engine" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"

[[bench]]
name = "large_session"
harness = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
